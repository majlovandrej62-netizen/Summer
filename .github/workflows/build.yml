name: Build Dylib
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Theos and SDKs
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
    - name: Compile
      run: |
        mkdir -p oxide
        cp Bypass.xm oxide/
        cd oxide
        echo "ARCHS = arm64 arm64e" > Makefile
        echo "TARGET = iphone:clang:latest:15.0" >> Makefile
        echo "include \$(THEOS)/makefiles/common.mk" >> Makefile
        echo "TWEAK_NAME = oxide" >> Makefile
        echo "oxide_FILES = Bypass.xm" >> Makefile
        echo "include \$(THEOS_MAKE_PATH)/tweak.mk" >> Makefile
        make
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bypass-Dylib
        path: oxide/.theos/obj/debug/*.dylib
